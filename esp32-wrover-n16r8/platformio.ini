; Experimental FusionEdge configuration for ESP32-WROVER-E N16R8
; (16 MB QSPI flash, 8 MB QSPI PSRAM).

[env:esp32-wrover-n16r8]
; Arduino Release v3.3.7 based on ESP-IDF v5.5.2.260206
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp-wrover-kit
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -fno-exceptions
    -Wall
    -Wextra
    -O2
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++20
    -D LGFX_USE_PNG

build_unflags = -std=gnu++11

lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit NeoPixel@^1.12.3
    lovyan03/LovyanGFX@^1.2.19

upload_speed = 460800
upload_resetmethod = nodemcu
upload_protocol = esptool
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

upload_flags =
    --before=default_reset
    --after=hard_reset
    --no-stub

monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
